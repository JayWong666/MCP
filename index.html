<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HEMS Workflow Glow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: radial-gradient(circle at 20% 20%, rgba(61, 252, 255, 0.18), transparent 55%),
          radial-gradient(circle at 80% 30%, rgba(255, 125, 214, 0.18), transparent 55%),
          radial-gradient(circle at 50% 80%, rgba(161, 147, 246, 0.12), transparent 60%),
          #05060e;
        --card-radius: 24px;
        --pill-radius: 999px;
        --border-width: 2px;
      }

      @property --angle {
        syntax: "<angle>";
        inherits: true;
        initial-value: 0turn;
      }

      @keyframes spin {
        to {
          --angle: 1turn;
        }
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Outfit", "Segoe UI", sans-serif;
        background: var(--bg);
        color: #f6f7ff;
        overflow: hidden;
      }

      .workflow-shell {
        display: flex;
        align-items: center;
        gap: clamp(2.5rem, 6vw, 6rem);
        padding: clamp(1.5rem, 5vw, 3.5rem);
        border-radius: 32px;
        position: relative;
      }

      .workflow-shell::before {
        content: "";
        position: absolute;
        inset: -160px;
        background: radial-gradient(circle at center, rgba(238, 235, 255, 0.1), transparent 60%);
        filter: blur(80px);
        z-index: -2;
      }

      .workflow-shell::after {
        content: "";
        position: absolute;
        inset: -40px;
        border-radius: inherit;
        background: linear-gradient(120deg, rgba(161, 147, 246, 0.28), rgba(61, 252, 255, 0.18));
        filter: blur(40px);
        opacity: 0.45;
        z-index: -3;
      }

      .input-column,
      .output-column {
        display: flex;
        flex-direction: column;
        gap: clamp(1rem, 3vw, 1.5rem);
      }

      .glow-pill {
        position: relative;
        padding: 0.85rem 1.8rem;
        border-radius: var(--pill-radius);
        min-width: 220px;
        letter-spacing: 0.02em;
        font-size: 1rem;
        font-weight: 500;
        text-align: center;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: rgba(5, 6, 14, 0.6);
        border: var(--border-width) solid transparent;
      }

      .glow-pill::before {
        content: "";
        position: absolute;
        inset: calc(-1 * var(--border-width));
        border-radius: inherit;
        border: inherit;
        background: conic-gradient(
            from var(--angle),
            rgba(238, 235, 255, 0.9) 0deg,
            rgba(161, 147, 246, 0.8) 100deg,
            rgba(61, 252, 255, 0.9) 200deg,
            rgba(255, 125, 214, 0.9) 320deg,
            rgba(238, 235, 255, 0.9) 360deg
          );
        -webkit-mask: linear-gradient(#000, #000), linear-gradient(#000, #000);
        -webkit-mask-clip: content-box, border-box;
        -webkit-mask-composite: xor;
        mask: linear-gradient(#000, #000), linear-gradient(#000, #000);
        mask-clip: content-box, border-box;
        mask-composite: exclude;
        animation: spin 4s linear infinite;
        z-index: -1;
      }

      .pill-glow {
        position: absolute;
        inset: -18px;
        border-radius: inherit;
        background: radial-gradient(circle at 50% 50%, rgba(61, 252, 255, 0.35), transparent 70%);
        filter: blur(30px);
        z-index: -2;
        opacity: 0.6;
      }

      .glow-pill:nth-child(2) .pill-glow {
        background: radial-gradient(circle at 50% 50%, rgba(161, 147, 246, 0.4), transparent 70%);
      }

      .glow-pill:nth-child(3) .pill-glow {
        background: radial-gradient(circle at 50% 50%, rgba(255, 125, 214, 0.35), transparent 70%);
      }

      .glow-pill .pip {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: rgba(61, 252, 255, 0.8);
        box-shadow: 0 0 18px rgba(61, 252, 255, 0.85);
        animation: blink 2.4s ease-in-out infinite;
      }

      .glow-pill:nth-child(2) .pip {
        background: rgba(161, 147, 246, 0.9);
        box-shadow: 0 0 18px rgba(161, 147, 246, 0.95);
        animation-delay: 0.5s;
      }

      .glow-pill:nth-child(3) .pip {
        background: rgba(255, 125, 214, 0.9);
        box-shadow: 0 0 18px rgba(255, 125, 214, 0.95);
        animation-delay: 1s;
      }

      @keyframes blink {
        0%,
        100% {
          transform: scale(0.9);
          opacity: 0.6;
        }
        50% {
          transform: scale(1.2);
          opacity: 1;
        }
      }

      .card-shell {
        position: relative;
      }

      .status-card {
        position: relative;
        padding: clamp(1.75rem, 4vw, 2.75rem);
        width: clamp(320px, 30vw, 420px);
        border-radius: var(--card-radius);
        background: rgba(10, 12, 24, 0.76);
        border: 1px solid rgba(238, 235, 255, 0.08);
        box-shadow: 0 30px 60px rgba(5, 6, 14, 0.65);
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        overflow: hidden;
      }

      .status-card::before {
        content: "";
        position: absolute;
        inset: -2px;
        border-radius: inherit;
        border: inherit;
        background: conic-gradient(
            from var(--angle),
            rgba(238, 235, 255, 0.75) 0deg,
            rgba(161, 147, 246, 0.6) 100deg,
            rgba(61, 252, 255, 0.7) 200deg,
            rgba(255, 125, 214, 0.7) 320deg,
            rgba(238, 235, 255, 0.75) 360deg
          );
        -webkit-mask: linear-gradient(#000, #000), linear-gradient(#000, #000);
        -webkit-mask-clip: content-box, border-box;
        -webkit-mask-composite: xor;
        mask: linear-gradient(#000, #000), linear-gradient(#000, #000);
        mask-clip: content-box, border-box;
        mask-composite: exclude;
        animation: spin 5s linear infinite;
        opacity: 0.45;
        z-index: -1;
      }

      .status-card header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .status-card h2 {
        font-size: clamp(1.25rem, 2vw, 1.6rem);
        font-weight: 600;
        margin: 0;
        letter-spacing: 0.02em;
      }

      .status-card .beam {
        width: 4px;
        height: 100%;
        background: linear-gradient(180deg, rgba(61, 252, 255, 0.6), rgba(161, 147, 246, 0.1));
        border-radius: 4px;
        box-shadow: 0 0 20px rgba(61, 252, 255, 0.8);
      }

      .status-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 1rem;
      }

      .status-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.9rem 1rem;
        border-radius: 16px;
        background: rgba(15, 17, 32, 0.7);
        border: 1px solid rgba(238, 235, 255, 0.04);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
      }

      .status-item .name {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-weight: 500;
        letter-spacing: 0.01em;
      }

      .status-item .step {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(238, 235, 255, 0.3);
        position: relative;
      }

      .status-item.active .step {
        background: rgba(61, 252, 255, 0.85);
        box-shadow: 0 0 16px rgba(61, 252, 255, 0.85);
      }

      .status-item.active .state {
        color: rgba(238, 235, 255, 0.95);
      }

      .status-item .state {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: rgba(238, 235, 255, 0.55);
      }

      .output-card {
        position: relative;
        padding: 1.4rem 1.8rem;
        border-radius: var(--card-radius);
        min-width: 240px;
        background: rgba(12, 15, 28, 0.85);
        border: var(--border-width) solid transparent;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        align-items: center;
      }

      .output-card::before {
        content: "";
        position: absolute;
        inset: calc(-1 * var(--border-width));
        border-radius: inherit;
        border: inherit;
        background: conic-gradient(
            from var(--angle),
            rgba(61, 252, 255, 0.9) 0deg,
            rgba(161, 147, 246, 0.95) 120deg,
            rgba(255, 125, 214, 0.9) 240deg,
            rgba(61, 252, 255, 0.9) 360deg
          );
        -webkit-mask: linear-gradient(#000, #000), linear-gradient(#000, #000);
        -webkit-mask-clip: content-box, border-box;
        -webkit-mask-composite: xor;
        mask: linear-gradient(#000, #000), linear-gradient(#000, #000);
        mask-clip: content-box, border-box;
        mask-composite: exclude;
        animation: spin 6s linear infinite;
        z-index: -1;
      }

      .output-card::after {
        content: "";
        position: absolute;
        inset: -50px;
        border-radius: inherit;
        background: radial-gradient(circle at 50% 50%, rgba(61, 252, 255, 0.35), transparent 75%);
        filter: blur(35px);
        z-index: -2;
      }

      .output-card .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 18px;
        font-size: 1.6rem;
        background: linear-gradient(135deg, rgba(61, 252, 255, 0.85), rgba(161, 147, 246, 0.9));
        box-shadow: 0 20px 40px rgba(61, 252, 255, 0.35);
      }

      .connection {
        position: relative;
        width: 120px;
        height: 4px;
        background: linear-gradient(90deg, rgba(61, 252, 255, 0.6), rgba(161, 147, 246, 0.2));
        border-radius: 4px;
        box-shadow: 0 0 25px rgba(61, 252, 255, 0.8);
      }

      .connection::before,
      .connection::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: inherit;
        animation: pulse 2s ease-in-out infinite;
      }

      .connection::after {
        animation-delay: 1s;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }

      .status-grid {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.9rem 1.1rem;
        align-items: center;
      }

      .status-grid .label {
        font-size: 0.95rem;
        font-weight: 500;
        color: rgba(238, 235, 255, 0.75);
      }

      .status-grid .progress {
        position: relative;
        height: 6px;
        border-radius: 999px;
        background: rgba(238, 235, 255, 0.1);
        overflow: hidden;
      }

      .status-grid .progress span {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(61, 252, 255, 0.9), rgba(255, 125, 214, 0.9));
        transform-origin: left center;
        animation: fill 4s ease-in-out infinite;
      }

      @keyframes fill {
        0% {
          transform: scaleX(0.15);
        }
        50% {
          transform: scaleX(0.85);
        }
        100% {
          transform: scaleX(0.2);
        }
      }

      .status-card footer {
        display: flex;
        align-items: center;
        gap: 1rem;
        font-size: 0.85rem;
        color: rgba(238, 235, 255, 0.65);
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(161, 147, 246, 0.9);
        box-shadow: 0 0 12px rgba(161, 147, 246, 0.9);
      }

      @media (max-width: 960px) {
        body {
          padding: 2rem 1rem;
        }
        .workflow-shell {
          flex-direction: column;
          align-items: stretch;
          gap: 2.5rem;
        }
        .input-column,
        .output-column {
          flex-direction: row;
          justify-content: center;
          flex-wrap: wrap;
        }
        .connection {
          width: 4px;
          height: 120px;
          background: linear-gradient(180deg, rgba(61, 252, 255, 0.6), rgba(161, 147, 246, 0.2));
        }
      }
    </style>
  </head>
  <body>
    <div class="workflow-shell">
      <div class="input-column">
        <div class="glow-pill">
          <span class="pill-glow"></span>
          <span class="pip"></span>
          PV Forecast
        </div>
        <div class="glow-pill">
          <span class="pill-glow"></span>
          <span class="pip"></span>
          TOU Pricing
        </div>
        <div class="glow-pill">
          <span class="pill-glow"></span>
          <span class="pip"></span>
          Demand Forecast
        </div>
      </div>

      <div class="connection"></div>

      <div class="card-shell">
        <div class="status-card">
          <header>
            <h2>Optimising Energy Flow</h2>
            <div class="beam"></div>
          </header>

          <ul class="status-list">
            <li class="status-item active">
              <div class="name">
                <span class="step"></span>
                Checking
              </div>
              <span class="state">In progress</span>
            </li>
            <li class="status-item active">
              <div class="name">
                <span class="step"></span>
                Thinking
              </div>
              <span class="state">Synthesising</span>
            </li>
            <li class="status-item">
              <div class="name">
                <span class="step"></span>
                Analysing
              </div>
              <span class="state">Queued</span>
            </li>
            <li class="status-item">
              <div class="name">
                <span class="step"></span>
                Planing
              </div>
              <span class="state">Pending</span>
            </li>
          </ul>

          <div class="status-grid">
            <span class="label">Throughput</span>
            <div class="progress"><span></span></div>
            <span class="label">Confidence</span>
            <div class="progress"><span></span></div>
          </div>

          <footer>
            <span class="dot"></span>
            Updating node matrix in real-time…
          </footer>
        </div>
      </div>

      <div class="connection"></div>

      <div class="output-column">
        <div class="output-card">
          <span class="badge">✓</span>
          HEMS Strategy Generated
        </div>
      </div>
    </div>
  </body>
</html>
